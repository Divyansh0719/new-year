<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body {
    margin: 0;
    font-family: 'Comic Sans MS', cursive;
    background: white;
    text-align: center;
    overflow: hidden;
}

.page {
    display: none;
    height: 100vh;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    opacity: 0;
    transform: scale(0.95);
    transition: 0.6s ease;
}

.page.active {
    display: flex;
    opacity: 1;
    transform: scale(1);
}

img {
    max-width: 280px;
    animation: pop 0.6s ease;
}

@keyframes pop {
    from { transform: scale(0.7); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
}

.heartbeat {
    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.08); }
    40% { transform: scale(1); }
    60% { transform: scale(1.08); }
    100% { transform: scale(1); }
}

button {
    margin-top: 20px;
    padding: 12px 40px;
    font-size: 18px;
    border-radius: 25px;
    border: 2px solid #444;
    background: white;
    cursor: pointer;
}

button:hover {
    transform: scale(1.05);
}

#muteBtn {
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 20px;
    padding: 10px 14px;
    border-radius: 50%;
    border: 2px solid #444;
    cursor: pointer;
    background: white;
    z-index: 999;
}
</style>
</head>

<body>

<audio id="bg-music" preload="auto">
    <source src="bg-music.mp3" type="audio/mpeg">
</audio>

<div id="muteBtn" onclick="toggleMusic()">🔊</div>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <img src="cat1.png" class="heartbeat">
    <div class="text">hey! i made something for you<br>will you see it?</div>
    <button onclick="startExperience()">START WITH SOUND 🎵</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <img src="cat2.png" class="heartbeat">
    <div class="text">HOW DARE YOUU!</div>
    <button onclick="goPage(3)">BACK</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
    <img src="cat3.png" class="heartbeat">
    <div class="text">Hehe!<br>click below for the surprise!!</div>
    <button onclick="goPage(4)">NEXT</button>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">
    <img src="cat4.png" class="heartbeat" onclick="goPage(5)">
    <div class="text">Happy new year my kuchupuchu!!!</div>
</div>

<!-- PAGE 5 -->
<div class="page" id="page5">
    <img src="cat5.png" class="heartbeat" onclick="goPage(6)">
    <div class="text">SMILEEEE<br>Click on the camera!</div>
</div>

<!-- PAGE 6 -->
<div class="page" id="page6">
    <img src="final.jpg" class="heartbeat" style="max-width:300px; border:10px solid white;">
    <div class="text">I Love You ❤️</div>
</div>

<script>
const music = document.getElementById("bg-music");
let started = false;

function startExperience() {
    if (!started) {
        music.currentTime = 31;
        music.volume = 0;
        music.play();

        let fade = setInterval(() => {
            if (music.volume < 0.5) {
                music.volume += 0.02;
            } else {
                clearInterval(fade);
            }
        }, 200);

        started = true;
    }
    goPage(3);
}

function goPage(n) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById("page" + n).classList.add("active");
}

function toggleMusic() {
    if (music.paused) {
        music.play();
        document.getElementById("muteBtn").innerText = "🔊";
    } else {
        music.pause();
        document.getElementById("muteBtn").innerText = "🔇";
    }
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) music.pause();
    else if (started) music.play();
});
</script>

</body>
</html>
